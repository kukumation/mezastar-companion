<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>明耀之星 Companion</title>

<!-- theme-color（初始值与 light 主题 bg 一致，applyTheme 会按主题动态更新）-->
<meta name="theme-color" content="#F7FAFF">

<!-- 防闪烁：在 CSS 应用前同步设置 data-theme -->
<script>
  (() => {
    const validThemes = ["light", "dark", "comfort"];
    let theme = null;
    try { theme = localStorage.getItem("mezastar-theme"); } catch (e) { theme = null; }
    if (!validThemes.includes(theme)) {
      theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.dataset.theme = theme;
    // 语言预加载（防闪烁）
    try {
      const lang = localStorage.getItem("mezastar-lang");
      if(lang) document.documentElement.dataset.lang = lang;
    } catch(e) {}
  })();
</script>

<link rel="stylesheet" href="style.css?v=20260811j">
</head>
<body>

<!-- SVG symbols：属性图标（按 data-type 名引用，符号内容为通用圆形，因 18 系属性是中文，图标作装饰用） -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute;overflow:hidden">
  <symbol id="type-symbol" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="currentColor" opacity="0.9"/>
    <circle cx="12" cy="12" r="5" fill="#FFFFFF" opacity="0.35"/>
  </symbol>
</svg>

<!-- ===== Sticky Header ===== -->
<header class="topbar">
  <div class="app-brand">
    <span class="brand-ball" aria-hidden="true"></span>
    <div>
      <strong>明耀之星</strong>
      <small>Companion</small>
    </div>
  </div>

  <div class="theme-switcher" role="group" aria-label="界面主题">
    <button type="button" data-theme-value="light" aria-pressed="false">
      <span aria-hidden="true">☀</span>
      <span>明亮</span>
    </button>
    <button type="button" data-theme-value="dark" aria-pressed="false">
      <span aria-hidden="true">◐</span>
      <span>暗色</span>
    </button>
    <button type="button" data-theme-value="comfort" aria-pressed="false">
      <span aria-hidden="true">♧</span>
      <span>护眼</span>
    </button>
  </div>
  <div class="lang-switcher" role="group" aria-label="语言">
    <button type="button" data-lang-value="zh" aria-pressed="true">中</button>
    <button type="button" data-lang-value="en" aria-pressed="false">EN</button>
  </div>
</header>

<p id="themeStatus" class="sr-only" aria-live="polite"></p>

<div id="app">

  <!-- ===== 底部导航（四色顶线） ===== -->
  <nav class="app-nav" aria-label="主要导航">
    <button class="nav-item" data-tab="collection">
      <span class="nav-icon" aria-hidden="true">◆</span>
      <span>收藏</span>
    </button>
    <button class="nav-item is-active" data-tab="battle">
      <span class="nav-icon" aria-hidden="true">⚔</span>
      <span>对战推荐</span>
    </button>
    <button class="nav-item" data-tab="type-chart">
      <span class="nav-icon" aria-hidden="true">◎</span>
      <span>属性表</span>
    </button>
  </nav>

  <!-- ===== 对战推荐页 ===== -->
  <div id="tab-battle" class="tab-content active">
    <div class="battle-section">
      <h2>对战推荐</h2>
      <p class="hint">选择对方宝可梦（最多3只），根据你的收藏推荐阵容</p>

      <!-- 选中的敌方 -->
      <div id="enemy-slots" class="enemy-slots">
        <div class="enemy-slot empty" data-slot="0">
          <span class="slot-plus">+</span>
          <span class="slot-label">敌方1</span>
        </div>
        <div class="enemy-slot empty" data-slot="1">
          <span class="slot-plus">+</span>
          <span class="slot-label">敌方2</span>
        </div>
        <div class="enemy-slot empty" data-slot="2">
          <span class="slot-plus">+</span>
          <span class="slot-label">敌方3</span>
        </div>
      </div>

      <!-- 敌方选择面板（弹出式） -->
      <div id="enemy-picker" class="enemy-picker hidden">
        <div class="picker-header">
          <span>选择敌方宝可梦</span>
          <button id="picker-close" class="picker-close">✕</button>
        </div>
        <div class="picker-filters">
          <select id="picker-rarity">
            <option value="all">全部星级</option>
            <option value="6">★6</option>
            <option value="5">★5</option>
            <option value="4">★4</option>
            <option value="3">★3</option>
            <option value="2">★2</option>
          </select>
          <input type="text" id="picker-search" placeholder="搜索宝可梦名字...">
        </div>
        <div id="picker-grid" class="picker-grid"></div>
      </div>

      <!-- 推荐结果 -->
      <div id="recommend-result" class="recommend-result">
        <p class="hint">选择敌方宝可梦后，这里会显示推荐阵容</p>
      </div>
    </div>
  </div>

  <!-- ===== 收藏页 ===== -->
  <div id="tab-collection" class="tab-content">
    <div class="filter-bar">
      <select id="filter-series">
        <option value="all">全部弹数</option>
      </select>
      <select id="filter-rarity">
        <option value="all">全部稀有度</option>
        <option value="6">★6</option>
        <option value="5">★5</option>
        <option value="4">★4</option>
        <option value="3">★3</option>
        <option value="2">★2</option>
      </select>
      <select id="filter-type">
        <option value="all">全部属性</option>
      </select>
      <label class="owned-only">
        <input type="checkbox" id="filter-owned"> 只看已收藏
      </label>
      <input type="text" id="filter-search" placeholder="搜索宝可梦..." class="filter-search">
    </div>
    <div class="stats-bar" id="collection-stats"></div>
    <div id="card-grid" class="card-grid"></div>
  </div>

  <!-- ===== 属性克制表页 ===== -->
  <div id="tab-type-chart" class="tab-content">
    <h2>属性克制表</h2>
    <p class="hint">点击属性查看攻击效果</p>
    <div id="type-grid" class="type-grid"></div>
    <div id="type-result" class="type-result"></div>
  </div>
</div>

<!-- ===== 卡牌详情弹窗 ===== -->
<div id="card-detail-overlay" class="detail-overlay" onclick="if(event.target===this)closeCardDetailPub()">
  <div id="card-detail-modal" class="detail-modal"></div>
</div>

<script src="type_chart.js?v=20260811j"></script>
<script src="app.js?v=20260811j"></script>
</body>
</html>
